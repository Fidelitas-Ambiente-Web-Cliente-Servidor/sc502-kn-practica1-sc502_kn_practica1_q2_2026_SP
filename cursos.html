<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia de Asados - Cursos</title>

    <!--import de bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--import de los css -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cursos.css">
</head>

<body>

    <!--NavBar -->
    <div id="navbar-placeholder"></div>

    <main>
        <!-- encabezado de cursos -->
        <section class="py-5 bg-navy text-center">
            <div class="container py-4">
                <h1 class="display-5 fw-bold text-white mb-3">Nuestros Cursos</h1>
                <p class="lead text-muted mx-auto" style="max-width: 600px;">
                    Explora nuestra selección de masterclasses y cursos diseñados para elevar tus habilidades frente a
                    la parrilla.
                </p>

                <!-- barra de busqueda -->
                <div class="row justify-content-center mt-4">
                    <div class="col-md-6">
                        <div class="input-group">
                            <input type="text" id="buscar-input" class="form-control bg-dark text-light border-secondary"
                                placeholder="Buscar curso, técnica o corte..." aria-label="Buscar curso">
                            <button class="btn btn-academy" type="button">Buscar</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- listado de cursos generados por js -->
        <section class="py-5">
            <div class="container">
                <div class="row mb-4 align-items-center">
                    <div class="col-md-6">
                        <h2 class="fw-bold texto-navy border-bottom pb-2 mb-0">Catálogo de Cursos</h2>
                    </div>
                    <div class="col-md-6 text-md-end mt-3 mt-md-0">
                        <select id="categoria-select" class="form-select bg-dark text-light border-secondary w-auto d-inline-block">
                            <option value="Todos">Todas las Categorías</option>
                            <option value="Premium">Cortes Premium</option>
                            <option value="Tradicional">Tradicional</option>
                            <option value="Ahumados">Ahumados</option>
                        </select>
                    </div>
                </div>
                <!-- contenedor dinamico -->
                <div class="row g-4" id="cursos-container">
                </div>
            </div>
        </section>
    </main>

    <!-- footer -->
    <div id="footer-placeholder"></div>

    <!-- script de los componentes compartidos (navbar y footer) -->
    <script src="js/componentes.js"></script>

    <!-- bundle para que sea responsive con moviles, js,bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/cursos.js"></script>

</body>

</html>
